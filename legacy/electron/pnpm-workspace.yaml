# ---------------------------------------------------------------------------
# pnpm settings.
#
# pnpm 12 keeps its configuration here rather than in package.json, and it
# writes this file itself the first time it refuses to run an install script.
#
# Which scripts are allowed to run is a real decision, not a formality. npm 11
# and pnpm both stopped running postinstall scripts by default, because a
# package's install script runs with your user's rights before you have looked
# at any of its code. Only one package here needs its script:
#
#   esbuild   picks the native binary for this machine. Without it the module
#             installs and then fails the first time Vite tries to use it.
#
# Electron is deliberately NOT listed. It has no postinstall script: since
# around version 30 it downloads the browser lazily, the first time
# node_modules/electron is required. Listing it here would suggest otherwise
# and would hide the real fix when that download cannot reach GitHub, which is
# to set ELECTRON_MIRROR and require it once:
#
#   ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ \
#     node -e "console.log(require('electron'))"
#
# Everything else in the tree stays blocked, which is the point.
# ---------------------------------------------------------------------------
allowBuilds:
  # electron-winstaller is the Windows NSIS installer. This build ships a
  # macOS .dmg only, so its install script stays blocked like everything else.
  electron-winstaller: false
  esbuild: true
