# Manual-only macOS build. **Not** triggered by tags or pushes: releases are
# built and tested locally, so nothing here runs unless someone presses
# "Run workflow" in the Actions tab.
#
# The local flow:
#
#   macos/scripts/package.sh
#   ditto -c -k --keepParent "dist/Classic Game Box (Swift).app" "dist/ClassicGameBox-<version>.zip"
#   gh release create <tag> dist/ClassicGameBox-<version>.zip
#
# This workflow is an optional convenience for building the `.app` on a clean
# runner. It bundles **no cores**: the app ships the full `cores/cores.json`
# and downloads a core from the libretro buildbot on demand. J2ME
# (`freej2me_plus`) has no buildbot build and must be compiled from source —
# see `cores/README.md`. `macos/scripts/package.sh` bundles whatever is in
# `cores/dist`; build a set there first if you want one in the bundle.
#
# The app is **not notarized** (ad-hoc codesigned), so a downloaded copy is
# quarantined by Gatekeeper: right-click -> Open, or
# `xattr -dr com.apple.quarantine "Classic Game Box (Swift).app"`.
#
# Must run on an **arm64** macOS runner: the app is arm64 only.

name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # Match the Swift package's deployment target (see macos/Package.swift).
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v5

      - name: Require an arm64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "arch=$arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::the app is arm64 only; use a macOS arm64 runner"
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Gate (fmt + clippy + test)
        run: ./scripts/dev.sh

      - name: Package the app
        run: macos/scripts/package.sh

      - name: Stamp a tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release-}"
          version="${version#beta-}"
          app="dist/Classic Game Box (Swift).app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          # Editing the plist invalidates the ad-hoc signature; re-sign it.
          codesign --force --deep --sign - "$app"

      - name: Zip the app
        run: |
          set -euo pipefail
          suffix="${GITHUB_REF_NAME:-snapshot}"
          ditto -c -k --keepParent "dist/Classic Game Box (Swift).app" "dist/ClassicGameBox-${suffix}.zip"
          ls -lh dist/*.zip

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/ClassicGameBox-*.zip

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'beta-') }}
          generate_release_notes: true
          files: dist/ClassicGameBox-*.zip
