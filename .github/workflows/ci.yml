# The Rust gate on every push to `main` and every pull request: format, clippy
# (warnings are errors) and the test suite, i.e. `./scripts/dev.sh`.
#
# This runs on the Rust workspace only. The Swift host is built by the release
# workflow (`release.yml`); a PR that touches `macos/` but not the Rust crate
# would not be caught here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Gate (fmt + clippy + test)
        run: ./scripts/dev.sh
