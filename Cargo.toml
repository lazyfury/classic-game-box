[workspace]
resolver = "2"
members = [
    "crates/cgb-libretro",
    "crates/cgb-systems",
    "crates/cgb-audio",
    "crates/cgb-input",
    "crates/cgb-paths",
    "crates/cgb-cores",
    "crates/cgb-library",
]

# ---------------------------------------------------------------------------
# The app package. It is the workspace root (the layout mirrors `../archiver`):
# the `classic-game-box` binary is a thin CLI over the library in `src/`.
# ---------------------------------------------------------------------------
[package]
name = "cgb-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "classic-game-box"
path = "src/main.rs"

[workspace.package]
version = "0.2.0"
edition = "2021"
# `wgpu` 24 / `winit` 0.30 (pulled in by quill and this app) require 1.76.
rust-version = "1.76"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazyfury/classic-game-box"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# igui — the UI stack, a GitHub dependency (`lazyfury/igui`, formerly `quill`),
# pinned to the `v0.2.0` commit. The facade carries opt-in features; three
# crates are not in the facade and are declared directly from the same source:
#   * `igui_svg`   — icon vector fallback (no `svg` facade feature exists);
#   * `igui_winit` — the window / input / IME / clipboard platform plugins;
#   * `igui_core`  — for `cgb-input` (which must stay UI-free) and the in-app `ui`.
# Bump the pin with e.g.
#   `cargo update -p igui -p igui_svg -p igui_winit -p igui_core`.
# ---------------------------------------------------------------------------
igui = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0", default-features = false }
igui_svg = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_winit = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_core = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_scene = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }

# ---------------------------------------------------------------------------
# Internal crates. One concern each; see docs/architecture/quill-native-migration.md.
# ---------------------------------------------------------------------------
cgb-systems = { path = "crates/cgb-systems" }
cgb-libretro = { path = "crates/cgb-libretro" }
cgb-audio = { path = "crates/cgb-audio" }
cgb-input = { path = "crates/cgb-input" }
cgb-paths = { path = "crates/cgb-paths" }
cgb-cores = { path = "crates/cgb-cores" }
cgb-library = { path = "crates/cgb-library" }

# ---------------------------------------------------------------------------
# Platform / host dependencies.
# ---------------------------------------------------------------------------
libloading = "0.8"
# Build-dependency of `cgb-libretro`: compiles the C variadic log shim.
cc = "1"
cpal = "0.15"
ringbuf = "0.4"
gilrs = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The dynamic core downloader: a blocking HTTPS client (rustls, no OpenSSL)
# and just the DEFLATE codec for the buildbot's `.zip` payloads.
ureq = { version = "2", features = ["proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Native file/folder dialogs. macOS uses the objc2 backend, which is
# unconditional; the default `xdg-portal`/`async-std` features are Linux-only,
# so drop them rather than pull a second async runtime into the lockfile.
rfd = { version = "0.15", default-features = false }
winit = "0.30"
thiserror = "2"

# ---------------------------------------------------------------------------
# The app's dependencies (the root package). Internal crates and platform/host
# deps resolve through `[workspace.dependencies]` above.
# ---------------------------------------------------------------------------
[dependencies]
cgb-systems.workspace = true
cgb-libretro.workspace = true
cgb-audio.workspace = true
cgb-input.workspace = true
cgb-paths.workspace = true
cgb-cores.workspace = true
cgb-library.workspace = true

# The `igui` facade: `ui` (drawing / components), `app` (the plugin runtime),
# `wgpu` (the native backend), `profile` (frame inspection), `recording` and
# `headless` (the `--selfcheck` presenter). The view lives in `src/ui`.
igui = { workspace = true, features = ["ui", "app", "wgpu", "profile", "recording", "headless"] }
# Not covered by any facade feature. `igui_scene` / `igui_core` are also
# required by igui's `impl_scene_child!` macro, which expands to bare
# `igui_scene::` / `igui_core::` paths (no `$crate`).
igui_svg.workspace = true
igui_scene.workspace = true
igui_core.workspace = true
# Window / input / IME / text-metrics / clipboard platform plugins.
igui_winit.workspace = true

winit.workspace = true
rfd.workspace = true

# The headless UI benchmark (`benches/ui.rs`) uses igui's measurement harness.
[dev-dependencies]
igui = { workspace = true, features = ["bench"] }

[[bench]]
name = "ui"
harness = false

[profile.release]
opt-level = "s"
lto = true

# The emulator wants throughput, not size: cores run every frame.
[profile.release.package.cgb-libretro]
opt-level = 3

[profile.bench]
opt-level = 3
