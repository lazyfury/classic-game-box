[workspace]
# cgb-app is the workspace **root package** (this file); the emulator boundary
# is the one member package. `crates/cgb-*` helpers all merged in (see
# crates/README.md).
members = [
    "crates/cgb-libretro",
]
resolver = "2"

[package]
name = "cgb-app"
description = "Classic Game Box: the app library (UI + emulator host) embedded by the native macOS host."
version.workspace = true
edition.workspace = true
# `wgpu` 24 and igui require Rust 1.76; `diesel` 2.3 requires 1.86.
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/lazyfury/classic-game-box"

[lib]
# `lib` for normal Rust consumers; `staticlib` (libcgb_app.a) is what the Swift
# host links. Both build from the same crate.
crate-type = ["lib", "staticlib"]

[dependencies]
cgb-libretro.workspace = true
# The `igui` facade: `ui` (drawing / components), `app` (the plugin runtime),
# `wgpu` (the native backend), `profile` (frame inspection), `recording` and
# `headless` (the `--selfcheck` presenter). The view lives in `src/ui`.
igui = { workspace = true, features = ["ui", "app", "wgpu", "profile", "recording", "headless"] }
# Not covered by any facade feature. `igui_scene` / `igui_core` are also
# required by igui's `impl_scene_child!` macro, which expands to bare
# `igui_scene::` / `igui_core::` paths (no `$crate`).
igui_svg.workspace = true
igui_scene.workspace = true
igui_core.workspace = true
rfd.workspace = true

# Core manifest + catalog + runtime downloader (src/cores/).
serde = { workspace = true }
serde_json.workspace = true
ureq.workspace = true
zip.workspace = true

# Emulator-facing devices the app owns (src/audio, src/host):
cpal.workspace = true
ringbuf.workspace = true

# Game library (src/library/) and file layout (src/paths.rs):
diesel.workspace = true
# Enables the bundled SQLite that `diesel` links (the driver crate itself is
# not called directly).
libsqlite3-sys.workspace = true
png.workspace = true
dirs.workspace = true
thiserror.workspace = true

# System clipboard for the Swift host's text fields (src/native/plugins.rs).
arboard = "3"

# Pins the `windows` crate `gpu-allocator` resolves to. `gpu-allocator` accepts
# a range (`>=0.53,<=0.58`) and cpal pulls `windows 0.54`, so a re-resolve can
# unify it onto 0.54 while wgpu-hal uses 0.58 — their `ID3D12*` types then
# mismatch and the DX12 build fails. Referenced (unused) below to hold 0.58.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# The headless UI benchmark (`benches/ui.rs`) uses igui's measurement harness.
[dev-dependencies]
igui = { workspace = true, features = ["bench"] }

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# igui — the UI stack, a GitHub dependency (`lazyfury/igui`, formerly `quill`),
# pinned to the `v0.3.1` tag. Two crates are not in the facade and are declared
# from the same source: `igui_svg` (icon vector fallback) and `igui_core` (the
# app's input state). Bump with `cargo update -p igui -p igui_svg -p igui_core`.
# ---------------------------------------------------------------------------
igui = { git = "https://github.com/lazyfury/igui", tag = "v0.3.1", default-features = false }
igui_svg = { git = "https://github.com/lazyfury/igui", tag = "v0.3.1" }
igui_core = { git = "https://github.com/lazyfury/igui", tag = "v0.3.1" }
igui_scene = { git = "https://github.com/lazyfury/igui", tag = "v0.3.1" }

cgb-libretro = { path = "crates/cgb-libretro" }

# Platform / host dependencies.
libloading = "0.8"
# See the root package's `cfg(windows)` dependencies: keeps `gpu-allocator` on
# `windows 0.58` so its DX12 types match wgpu-hal's.
windows = { version = "0.58", default-features = false }
# Build-dependency of `cgb-libretro`: compiles the C variadic log shim.
cc = "1"
cpal = "0.15"
ringbuf = "0.4"
# The library ORM. `libsqlite3-sys` with `bundled` compiles SQLite from source
# (diesel's `sqlite` feature links it but does not bundle it), so the Windows
# cross-build needs no system SQLite.
diesel = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
png = "0.17"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The dynamic core downloader: a blocking HTTPS client (rustls, no OpenSSL)
# and just the DEFLATE codec for the buildbot's `.zip` payloads.
ureq = { version = "2", features = ["proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Native file/folder dialogs. macOS uses the objc2 backend, which is
# unconditional; the default `xdg-portal`/`async-std` features are Linux-only,
# so drop them rather than pull a second async runtime into the lockfile.
rfd = { version = "0.15", default-features = false }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true

# The emulator wants throughput, not size: cores run every frame.
[profile.release.package.cgb-libretro]
opt-level = 3

[profile.bench]
opt-level = 3
