[workspace]
resolver = "2"
members = [
    "crates/cgb-app",
    "crates/cgb-ui",
    "crates/cgb-libretro",
    "crates/cgb-systems",
    "crates/cgb-audio",
    "crates/cgb-input",
    "crates/cgb-library",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# `wgpu` 24 / `winit` 0.30 (pulled in by quill and this app) require 1.76.
rust-version = "1.76"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazyfury/classic-game-box"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# igui — the UI stack, a GitHub dependency (`lazyfury/igui`, formerly `quill`),
# pinned to the `v0.2.0` commit. The facade carries opt-in features; three
# crates are not in the facade and are declared directly from the same source:
#   * `igui_svg`   — icon vector fallback (no `svg` facade feature exists);
#   * `igui_winit` — the window / input / IME / clipboard platform plugins;
#   * `igui_core`  — for `cgb-input`, which must stay UI-free (dependency rule).
# Bump the pin with e.g.
#   `cargo update -p igui -p igui_svg -p igui_winit -p igui_core`.
# ---------------------------------------------------------------------------
igui = { git = "https://github.com/lazyfury/igui", rev = "79bb25905ed83dbe637d5d790d02537b47795fed", default-features = false }
igui_svg = { git = "https://github.com/lazyfury/igui", rev = "79bb25905ed83dbe637d5d790d02537b47795fed" }
igui_winit = { git = "https://github.com/lazyfury/igui", rev = "79bb25905ed83dbe637d5d790d02537b47795fed" }
igui_core = { git = "https://github.com/lazyfury/igui", rev = "79bb25905ed83dbe637d5d790d02537b47795fed" }
igui_scene = { git = "https://github.com/lazyfury/igui", rev = "79bb25905ed83dbe637d5d790d02537b47795fed" }

# ---------------------------------------------------------------------------
# Internal crates. One concern each; see docs/architecture/quill-native-migration.md.
# ---------------------------------------------------------------------------
cgb-systems = { path = "crates/cgb-systems" }
cgb-libretro = { path = "crates/cgb-libretro" }
cgb-audio = { path = "crates/cgb-audio" }
cgb-input = { path = "crates/cgb-input" }
cgb-library = { path = "crates/cgb-library" }
cgb-ui = { path = "crates/cgb-ui" }

# ---------------------------------------------------------------------------
# Platform / host dependencies.
# ---------------------------------------------------------------------------
libloading = "0.8"
cpal = "0.15"
ringbuf = "0.4"
gilrs = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file/folder dialogs. macOS uses the objc2 backend, which is
# unconditional; the default `xdg-portal`/`async-std` features are Linux-only,
# so drop them rather than pull a second async runtime into the lockfile.
rfd = { version = "0.15", default-features = false }
winit = "0.30"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true

# The emulator wants throughput, not size: cores run every frame.
[profile.release.package.cgb-libretro]
opt-level = 3

[profile.bench]
opt-level = 3
