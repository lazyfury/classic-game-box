[package]
name = "cgb-mac"
description = "Embedded macOS host for cgb-app: a Swift-provided CAMetalLayer + the igui runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cgb_mac"
# Static so the Swift binary is self-contained: SwiftPM's `-lcgb_mac` picks the
# `.a` and no dylib has to be bundled or `@rpath`-fixed.
crate-type = ["staticlib"]

[dependencies]
# The whole app (UI + emulator), without the bundled `winit` host.
cgb-app.workspace = true
# The window / gamepad host contract.
cgb-host.workspace = true
# The plugin runtime + native backend the host assembles. `igui_core` /
# `igui_render` / `igui_ui` come through the facade's features.
igui = { workspace = true, features = ["ui", "app", "wgpu", "profile"] }
# `GamepadSnapshot` for the Swift gamepad source.
cgb-input.workspace = true
# System clipboard for the text fields (the same crate `igui_winit` uses).
arboard = "3"
