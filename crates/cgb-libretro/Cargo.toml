[package]
name = "cgb-libretro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cgb-systems.workspace = true
libloading.workspace = true
thiserror.workspace = true

[build-dependencies]
# The libretro log callback is C-variadic; the formatting lives in
# `src/log_shim.c` because Rust cannot define C-variadic functions on stable.
cc.workspace = true

[dev-dependencies]
# The integration test applies the manifest's `option_defaults` before loading,
# the same way `Session::new` does, so it tests the app's loading path.
cgb-library.workspace = true
